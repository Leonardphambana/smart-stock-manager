<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stock Taking</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- HEADER -->
    <header class="header">

        <div class="header-top">

            <h1>Stock Taking & Balancing</h1>

            <nav>

                <a href="index.html">
                    Dashboard
                </a>

                <a href="stock-taking.html">
                    Stock Taking
                </a>

            </nav>

        </div>

    </header>

    <main class="container">

        <!-- FILTERS -->
        <section class="inventory-section">

            <div class="section-header">
                <h2>Filters</h2>
                <button type="button" class="export-btn" id="resetStockTakeFilters">
                    Reset
                </button>
            </div>

            <div class="filters-grid">

                <select id="stockTakeShopFilter" aria-label="Filter by shop">
                    <option value="">
                        All Shops
                    </option>

                    <option value="Shop 1">
                        Shop 1
                    </option>

                    <option value="Shop 2">
                        Shop 2
                    </option>
                </select>

                <input
                    type="date"
                    id="stockTakeDateFilter"
                    aria-label="Filter by date"
                >

                <select id="stockTakeItemFilter" aria-label="Filter by item">
                    <option value="">
                        All Items
                    </option>
                </select>

            </div>

        </section>

        <!-- SHOP 1 -->
        <section class="inventory-section" id="stockTakeShop1Section">

            <div class="section-header">
                <h2>Shop 1 Stock Taking</h2>
                <button type="button" class="export-btn" data-export="stockTakeShop1">
                    Export Excel
                </button>
            </div>

            <table>

                <thead>

                    <tr>

                        <th>Item</th>

                        <th>System Stock</th>

                        <th>Actual Count</th>

                        <th>Difference</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="stockTakeShop1Body">

                </tbody>

            </table>

        </section>

        <!-- SHOP 2 -->
        <section class="inventory-section" id="stockTakeShop2Section">

            <div class="section-header">
                <h2>Shop 2 Stock Taking</h2>
                <button type="button" class="export-btn" data-export="stockTakeShop2">
                    Export Excel
                </button>
            </div>

            <table>

                <thead>

                    <tr>

                        <th>Item</th>

                        <th>System Stock</th>

                        <th>Actual Count</th>

                        <th>Difference</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="stockTakeShop2Body">

                </tbody>

            </table>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
